<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kpopville: Demo</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<style>
/* Intentionally crude white-background / classic web look. */
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;}
body{background:#fff;color:#000;font-family:"Comic Sans MS","Comic Sans",Arial,sans-serif;}
button{font-family:inherit;cursor:pointer;color:#000;}
#game{width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:#fff;}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 15px;background:#fff;border-bottom:3px solid #000;}
.logo{font-family:Impact,"Arial Black",sans-serif;font-weight:900;font-size:clamp(24px,5vw,46px);letter-spacing:1px;}
.small{font:700 14px Arial,sans-serif;color:#000;}
.reset{background:#ccc;border:3px solid #000;border-radius:0;padding:8px 14px;font-size:15px;font-weight:bold;}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 18px;gap:22px;min-height:0;background:#fff;}
main.center{text-align:center;}
.tag{font-size:clamp(15px,2vw,22px);text-transform:uppercase;color:#000;font-weight:900;background:#fff;padding:3px 12px;border:2px solid #000;}
.big{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(48px,9vw,118px);line-height:1.02;letter-spacing:1px;margin:0;color:#000;}
.lead{max-width:780px;font-size:clamp(18px,2.2vw,25px);font-weight:bold;line-height:1.35;margin:0;color:#000;}
.primary,.secondary{background:#bcbcbc;border:4px solid #000;border-radius:0;padding:12px 24px;font-weight:900;font-size:clamp(17px,2vw,24px);}
.secondary{background:#9fb9e6;}
button:hover{background:#b7cdf0;}
button:active{background:#777;transform:translate(2px,2px);}
.choices{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;width:100%;}
.panel{background:#fff;border:4px solid #000;border-radius:0;padding:18px;max-width:860px;width:min(100%,860px);text-align:left;}
.speaker{background:#ddd;border:2px solid #000;display:inline-block;font-size:19px;font-weight:900;padding:3px 12px;margin-bottom:15px;}
.dialogue{font-size:clamp(19px,2.7vw,29px);line-height:1.35;margin:0 0 22px;font-weight:bold;}
.stage{width:min(100%,860px);min-height:clamp(180px,30vh,330px);background:#fff;border:4px solid #000;border-radius:0;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.stage .art{font-family:Impact,"Arial Black",sans-serif;font-size:clamp(55px,9vw,115px);color:#000;z-index:1;}
.stage .hint{position:relative;z-index:1;background:#fff;border:2px dashed #000;padding:7px;font-size:clamp(13px,2vw,18px);font-weight:900;margin:10px 20px;}
.group{background:#ddd;border:4px solid #000;border-radius:0;width:min(300px,42vw);min-height:240px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.group:nth-child(2){background:#aac2ea;}
.group .symbol{font-size:73px;}
.group strong{font:900 clamp(23px,4vw,40px) Impact,"Arial Black",sans-serif;}
.map{width:min(100%,1100px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;}
.place{background:#ddd;border:4px solid #000;border-radius:0;min-height:clamp(150px,22vh,225px);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;}
.place:nth-child(2),.place:nth-child(4){background:#b3c8e8;}
.place .symbol{font-size:clamp(40px,6vw,80px)}
.place strong{font:900 clamp(20px,3vw,36px) Impact,"Arial Black",sans-serif;}
.place span:last-child{font:700 15px Arial,sans-serif;}
.nav{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;}
footer{background:#fff;padding:8px 14px;text-align:center;font:700 13px Arial,sans-serif;}footer .reset{margin-left:16px;padding:4px 8px;font-size:12px;border-width:2px;}
@media(max-width:560px){.top{padding:9px}.logo{font-size:25px}.small{font-size:11px}main{padding:22px 12px;gap:18px}.map{gap:16px}.place{min-height:155px}.group{min-height:190px}.group .symbol{font-size:52px}.panel{padding:12px}.primary,.secondary{padding:10px 14px}}

/* Little mission note: deliberately plain, like an old browser game. */
#mission{position:fixed;left:12px;top:16px;z-index:30;width:215px;background:#fff;border:3px solid #000;padding:10px;box-shadow:3px 3px 0 #999;font-family:"Comic Sans MS","Comic Sans",Arial,sans-serif;text-align:left;}
#mission strong{display:block;font-size:20px;line-height:1.1;margin-bottom:8px;background:#ddd;padding:3px 5px;border:2px solid #000;}
#missionText{font-size:16px;line-height:1.3;font-weight:700;margin:0;overflow-wrap:anywhere;}
#mission small{display:block;font-size:12px;margin-top:8px;color:#444;}
/* Leave room for the mission note on large screens without enclosing the game in a window. */
@media(min-width:1000px){#screen{padding-left:235px;}}
@media(max-width:999px){#mission{position:relative;top:auto;left:auto;align-self:flex-start;margin:10px 12px 0;width:min(300px,calc(100% - 24px));box-shadow:none;}#screen{padding-top:16px;}}
/* Clickable hand-drawn maps, intentionally plain. */
.worldmap{position:relative;width:min(100%,calc(90vh * 2048 / 1600),1380px);aspect-ratio:2048 / 1600;margin:auto;overflow:hidden;}
.worldmap img{width:100%;height:100%;object-fit:cover;display:block}
.hotspot{position:absolute;border:3px dashed transparent;background:transparent;cursor:pointer;color:transparent;box-shadow:none;padding:0}
.hotspot:hover,.hotspot:focus-visible{border:3px dashed black;background:#ffffff55;outline:none}
.hotspot.girl{left:22%;top:29%;width:16%;height:26%;border-radius:45%}
.hotspot.boy{left:53%;top:20%;width:16%;height:22%;border-radius:45%}
.hotspot.downtown{left:29%;top:47%;width:24%;height:15%;border-radius:45%}
.hotspot.park{left:37%;top:31%;width:13%;height:12%;border-radius:26%}
.hotspot.gym{left:34%;top:21%;width:14%;height:8%;border-radius:25%}
.hotspot.salon{left:57%;top:43%;width:7%;height:9%;border-radius:30%}
.map-caption{font-size:16px;font-weight:900;text-align:center}
.hoodmap{position:relative;width:min(100%,1200px);aspect-ratio:2048 / 1423;margin:auto;overflow:hidden}
.hoodmap img{width:100%;height:100%;object-fit:contain;display:block}
.hood-house{position:absolute;border:none;background:transparent;padding:0;cursor:pointer;display:block;width:17%;aspect-ratio:1 / 1;filter:none}
.hood-house img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
.hood-house .house-label{position:absolute;left:17%;right:17%;top:30%;bottom:16%;display:flex;align-items:center;justify-content:center;text-align:center;font:900 clamp(11px,1.8vw,22px) "Comic Sans MS",Arial,sans-serif;color:#000;line-height:1.05;text-shadow:0 1px 0 #ffffff88;overflow-wrap:anywhere;padding:2px}
.hood-house:hover:not(.locked),.hood-house:focus-visible:not(.locked){transform:translateY(-2px);outline:none;filter:drop-shadow(0 3px 0 #00000022)}
.hood-house.locked{cursor:default}
.hood-house.locked .house-label{color:#333}
.hood-help{font-size:15px;font-weight:900;text-align:center;margin-top:8px}
/* Downtown: ugly old-school browser buttons, no polished cards. */
.downtown-list{width:min(100%,840px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;}
.downtown-place{background:#d3d3d3;border:4px solid #000;border-radius:0;font:900 clamp(16px,2.4vw,27px) "Comic Sans MS",Arial,sans-serif;min-height:125px;padding:12px 8px;overflow-wrap:anywhere;}
.downtown-place:nth-child(even){background:#b0c4e6;}
.downtown-place:hover{background:#b5c9e6;}
.downtownmap{position:relative;width:min(100%,1100px);aspect-ratio:2048 / 1423;margin:auto;}
.downtownmap img{width:100%;height:100%;object-fit:contain;display:block}
.hotspot.dthospital{left:2%;top:4%;width:30%;height:59%;border-radius:10%}
.hotspot.dtstudio{left:44%;top:3%;width:32%;height:18%;border-radius:10%}
.hotspot.dtplaza{left:37%;top:30%;width:31%;height:31%;border-radius:6%}
.hotspot.dtmall{left:69%;top:21%;width:29%;height:73%;border-radius:12%}
.hotspot.dtclub{left:2%;top:72%;width:36%;height:26%;border-radius:8%}
.hotspot.dtbakery{left:46%;top:75%;width:16%;height:19%;border-radius:10%}
@media(max-width:700px){.downtown-list{grid-template-columns:repeat(2,minmax(0,1fr));}.downtown-place{min-height:100px;}}
@media(max-width:600px){.worldmap{width:100%}.hood-house{width:19%}.hood-house .house-label{font-size:10px}}
/* Two-person dialogue, deliberately plain. */
.dialogue-scene{width:min(100%,1050px);display:flex;flex-direction:column;align-items:stretch;gap:0}
.portrait-row{display:flex;align-items:flex-end;justify-content:center;width:100%;height:min(52vh,420px);min-height:220px;gap:12px}
.person-portrait{width:auto;height:100%;max-width:46%;object-fit:contain;object-position:bottom;transition:opacity .12s}
.person-portrait.yn-portrait{height:82%;max-width:36%;align-self:flex-end}
.person-portrait.inactive{filter:grayscale(.5) brightness(.89);opacity:1}

.portrait-row.txt-bg{background:url("txt-house-inside.png") center center / cover no-repeat;border:3px solid #000;border-bottom:none;padding:0 10px}
.portrait-row.house-bg{background:url("enhypen-house-inside.png") center center / cover no-repeat;border:3px solid #000;border-bottom:none;padding:0 10px}
.art-image-stage{padding:0;background:#ddd;overflow:hidden}
.art-image-stage img{width:100%;height:100%;object-fit:cover;display:block}
.dialogue-scene .panel{max-width:none;width:100%;margin:0}
.dialogue-progress{font:700 14px Arial,sans-serif;margin:0 0 12px}
@media(max-width:680px){.portrait-row{height:260px;min-height:180px}.person-portrait{max-width:48%}.person-portrait.yn-portrait{max-width:40%;height:82%}.dialogue-scene .panel{min-width:0}}

/* The first scene: three hand-drawn sprites and a rough dialogue box. */
.square-scene{width:min(100%,1050px);display:flex;flex-direction:column;align-items:stretch;gap:0}
.square-characters{width:100%;height:clamp(230px,48vh,430px);display:flex;align-items:flex-end;justify-content:center;gap:clamp(5px,2vw,28px);border-bottom:3px solid black;background:#ddd url("town-square-bg.png") center center / cover no-repeat;overflow:hidden}
.square-person{width:30%;height:100%;object-fit:contain;object-position:bottom;transition:opacity .12s}
.square-person.square-yn{height:82%;width:27%}
.square-person.not-speaking{filter:grayscale(.5) brightness(.89);opacity:1}
.square-scene .panel{max-width:none;width:100%;margin:0}
.square-place{font:900 16px Arial,sans-serif;text-transform:uppercase}
/* Shared plaza artwork used both for recruiting and later visits. */
.plaza-view{width:min(100%,1050px);aspect-ratio:2048 / 1423;background:#ddd url("town-square-bg.png") center / contain no-repeat;border:3px solid #000;}
@media(max-width:650px){.square-characters{height:270px}.square-person{width:34%}.square-person.square-yn{width:29%;height:82%}}

/* Fit each scene within the visible browser viewport; no page scrolling. */
html,body{height:100%;overflow:hidden}
#game{height:100vh;height:100dvh;min-height:0;overflow:hidden}
#screen{height:100%;min-height:0;overflow:hidden;gap:clamp(4px,1vh,12px);padding:clamp(8px,1.5vh,16px) clamp(8px,1.5vw,18px);}
footer{flex:0 0 auto;padding:3px 8px;font-size:11px;min-height:28px}
footer .reset{padding:2px 6px;font-size:11px}
.big{font-size:clamp(30px,min(6vw,8vh),82px)}
.lead{font-size:clamp(13px,1.7vw,20px)}
.primary,.secondary{font-size:clamp(13px,1.5vw,20px);padding:clamp(5px,.9vh,10px) clamp(9px,1.5vw,18px);border-width:3px}
.tag{font-size:clamp(11px,1.5vw,17px);padding:2px 7px}
.panel{padding:clamp(7px,1.3vh,14px);flex:0 0 auto}
.speaker{font-size:clamp(13px,1.5vw,17px);margin-bottom:clamp(4px,.7vh,8px);padding:2px 8px}
.dialogue{font-size:clamp(14px,2vw,23px);line-height:1.2;margin:0 0 clamp(5px,1vh,11px)}
.dialogue-progress{margin:0 0 6px;font-size:12px}
.nav{gap:8px}
.stage{min-height:0;height:min(35vh,285px);flex-shrink:1}
.stage .art{font-size:clamp(35px,8vh,80px)}
.group{min-height:0;height:min(31vh,225px)}
.group .symbol{font-size:clamp(30px,7vh,65px)}
.worldmap,.downtownmap{width:min(100%,calc(67dvh * 2048 / 1423),1100px);height:auto;max-height:67dvh;aspect-ratio:2048 / 1423;}
.submap{height:min(62dvh,480px);min-height:0}
.map-caption{font-size:clamp(11px,1.3vw,15px);margin:0}
.dialogue-scene,.square-scene{height:min(100%,calc(100dvh - 90px));min-height:0;}
.portrait-row,.square-characters{height:auto;min-height:0;flex:1 1 0;}

.square-scene .panel,.dialogue-scene .panel{flex:0 0 auto}
.plaza-view{width:auto;max-width:100%;height:min(66dvh,590px);aspect-ratio:2048 / 1423}
#mission{top:8px;left:8px;width:clamp(130px,16vw,205px);padding:6px;box-shadow:none}
#mission strong{font-size:clamp(13px,1.5vw,18px);margin-bottom:4px}
#missionText{font-size:clamp(12px,1.2vw,15px)}
#mission small{font-size:11px;margin-top:4px}
@media(min-width:1000px){#screen{padding-left:clamp(145px,17vw,220px)}}
@media(max-width:999px){#mission{position:absolute;left:6px;top:6px;width:clamp(112px,19vw,170px);margin:0}#screen{padding-top:clamp(8px,1.5vh,16px)}}
@media(max-width:650px){
 #mission{width:120px;max-height:95px;overflow:hidden;padding:4px;border-width:2px}
 #mission strong{font-size:12px;padding:1px;margin-bottom:2px}
 #missionText{font-size:11px}#mission small{display:none}
 #screen{padding-left:4px;padding-right:4px;gap:5px}
 .square-person{width:31%}.square-person.square-yn{width:28%}
 .dialogue-scene,.square-scene{height:min(100%,calc(100dvh - 55px))}
 .panel{padding:6px;border-width:2px}
 .speaker{margin-bottom:4px}
 .dialogue{font-size:clamp(12px,3vw,17px)}
 .worldmap,.downtownmap{max-height:67dvh}
 .submap{height:55dvh}
 .plaza-view{height:min(55dvh,460px)}
 footer{font-size:9px}
}
@media(max-height:620px){
 #screen{gap:4px;padding-top:5px;padding-bottom:5px}
 .tag{display:none}

 .square-scene,.dialogue-scene{height:calc(100dvh - 42px)}

}

/* One large, consistent visual canvas for maps and cutscenes.
   It scales with the viewport but never changes proportions between scenes. */
#screen{
 --canvas-width:min(calc(100vw - 252px), calc((100dvh - 115px) * 2048 / 1423), 1280px);
 --canvas-height:calc(var(--canvas-width) * 1423 / 2048);
}
.worldmap,.downtownmap,.hoodmap,.plaza-view,
.square-scene,.dialogue-scene{
 width:var(--canvas-width);
 height:var(--canvas-height);
 min-height:0;
 max-height:none;
 max-width:100%;
 flex:0 0 auto;
 aspect-ratio:2048 / 1423;
 margin-left:auto;
 margin-right:auto;
}
.worldmap img,.downtownmap img,.hoodmap>img{width:100%;height:100%;display:block}
/* Dialogue panel lives inside the same-size canvas, rather than expanding it. */
.square-scene,.dialogue-scene{display:flex;flex-direction:column;overflow:hidden}
.square-characters,.portrait-row{height:0;min-height:0;flex:1 1 auto}
.square-scene>.panel,.dialogue-scene>.panel{flex:0 0 auto;max-height:43%;overflow:hidden}
/* Screens with static placeholder art use the same overall space budget. */
#screen:has(>.stage)>.stage{width:var(--canvas-width);height:calc(var(--canvas-height) * .62);min-height:0;flex:0 1 auto}
#screen:has(>.stage)>.panel{width:var(--canvas-width);max-width:100%;}
#screen:has(>.stage)>.tag,#screen:has(>.stage)>.big{flex:0 0 auto}
#screen:has(>.stage)>.big{font-size:clamp(22px,4vh,48px)}
@media(max-width:999px){
 #screen{--canvas-width:min(calc(100vw - 20px),calc((100dvh - 150px) * 2048 / 1423));}
}
@media(max-height:620px){
 #screen{--canvas-width:min(calc(100vw - 252px),calc((100dvh - 67px) * 2048 / 1423));}
}
@media(max-width:999px) and (max-height:620px){
 #screen{--canvas-width:min(calc(100vw - 12px),calc((100dvh - 85px) * 2048 / 1423));}
}
/* Keep neighborhood navigation visible, even when the map fills the viewport. */
.neighborhood-back{position:fixed;right:16px;top:14px;z-index:45;background:#b7c8e6;border:3px solid #000;font:900 clamp(13px,1.7vw,19px) "Comic Sans MS",Arial,sans-serif;padding:8px 12px;max-width:190px;}
@media(max-width:600px){.neighborhood-back{right:8px;top:8px;padding:6px 8px;font-size:12px;max-width:140px}}

/* Small, old-fashioned location scenes, all using the existing shared canvas. */
.activity-scene{width:var(--canvas-width);height:var(--canvas-height);max-width:100%;display:flex;flex-direction:column;min-height:0;margin:auto;border:3px solid #000;background:#fff;overflow:hidden}
.activity-art{position:relative;min-height:0;flex:1 1 auto;background:#e0e0e0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.activity-art .placeholder{border:3px dashed #666;background:#f3f3f3;padding:22px;font-size:clamp(14px,2vw,24px);font-weight:900;text-align:center}
.activity-art .desk-person{height:90%;max-width:37%;object-fit:contain;object-position:bottom;position:absolute;left:12%;bottom:0}
.activity-art .desk-sign{position:absolute;right:8%;bottom:10%;background:#b5c8e4;border:3px solid #000;padding:12px;font-weight:bold}
.activity-controls{flex:0 0 auto;background:#fff;border-top:3px solid #000;padding:8px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center}
.activity-controls button{font-size:clamp(11px,1.2vw,16px);padding:5px 9px;border-width:2px}
.activity-message{margin:0;flex-basis:100%;font-size:clamp(12px,1.3vw,16px);font-weight:bold;text-align:center}
@media(max-height:620px){.activity-controls{padding:4px}.activity-controls button{padding:3px 7px}}

/* Original, hand-drawn salon and gym backgrounds, beneath the desk sprites. */
.activity-art .background-asset{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:0;}
.activity-art .desk-person{z-index:2;}
.activity-art .desk-person.wonyoung-desk{height:92%;max-width:46%;left:8%;}
.activity-art .desk-sign{z-index:3;}
</style>

<body>
<div id="game"><aside id="mission" aria-live="polite"><strong>MISSION !!!</strong><p id="missionText"></p><small id="missionHint"></small></aside><main id="screen"></main><footer>MADE IN KPOPVILLE PAINT (sort of) // DEMO v0.7 <button class="reset" id="reset">Start over</button></footer></div>
<script>
const screen=document.getElementById('screen');
const KEY='kpopville-demo-save-v1';
let state={scene:'title',group:null,visited:[],area:'boys',introMissionDone:false};
try{let saved=JSON.parse(localStorage.getItem(KEY));if(saved && ['title','intro','choose','arrival','map','neighborhood','house','location','downtown','downtown-place','enhypen-dialogue','txt-dialogue','town-square'].includes(saved.scene)){state={...state,...saved};if(state.scene==='location')state.scene='map';}}catch{}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function go(scene){state.scene=scene;save();render()}
function btn(label,action,cls='primary'){let b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=action;return b}
function tag(s){let a=document.createElement('div');a.className='tag';a.textContent=s;return a}
function el(t,cls,text){let a=document.createElement(t);if(cls)a.className=cls;if(text!==undefined)a.textContent=text;return a}
function add(...items){screen.append(...items)}function center(){screen.className='center'}
function panel(name,text,buttons){let p=el('section','panel');p.append(el('div','speaker',name),el('p','dialogue',text));let n=el('div','nav');buttons.forEach(x=>n.append(btn(x[0],x[1],x[2]||'primary')));p.append(n);return p}
function stage(symbol,caption){let a=el('div','stage');a.append(el('div','art',symbol),el('div','hint',caption));return a}
function imageStage(src,alt){let a=el('div','stage art-image-stage');let img=document.createElement('img');img.src=src;img.alt=alt||'';a.append(img);return a}
const downtownPlaces={hospital:'Hospital',studio:'Dance / Singing Studio',plaza:'Central Plaza',mall:'Mall',club:'Club',bakery:'Bakery'};
const enhypenDialogue=[
 {speaker:'Y/N',expression:'scared',text:'Um... hello? Is this the ENHYPEN house?'},
 {speaker:'SUNGHOON',expression:'scared',text:'Yeah. Why do you look like you just saw a ghost?'},
 {speaker:'Y/N',expression:'default',text:'Oh. I just got here. Are you Sunghoon?'},
 {speaker:'SUNGHOON',expression:'default',text:"Yes, I'm Sunghoon."},
 {speaker:'Y/N',expression:'blush',text:'O-oh! Nice to meet you, Sunghoon...'},
 {speaker:'SUNGHOON',expression:'blush',text:'Nice to meet you too. Anyway, welcome to the house.'}
];
const ynImages={scared:'yn-scared.png',default:'yn-default.png',blush:'yn-blush.png'};
function showEnhypenDialogue(){
 center();
 const i=Math.max(0,Math.min(state.dialogueIndex||0,enhypenDialogue.length-1));
 const line=enhypenDialogue[i];
 const scene=el('div','dialogue-scene');

const recruitmentLines=[

 {speaker:'Y/N',text:'Um... why is everybody staring at me?',yn:'scared'},
 {speaker:'SOOBIN',text:'Welcome to Kpopville! You should join TXT. We have five very normal guys and a basement.',yn:'default'},
 {speaker:'JAY',text:'Hold on. ENHYPEN has seven members. Seven is obviously more than five.',yn:'default',jay:'default'},
 {speaker:'SOOBIN',text:"That's not how choosing a family works.",yn:'default'},
 {speaker:'JAY',text:'We also have a mansion. And I can make pancakes.',yn:'default',jay:'smile'},
 {speaker:'SOOBIN',text:'He burns the pancakes. We have snacks that are edible.',yn:'blush'},
 {speaker:'Y/N',text:'You guys are really fighting over me...?',yn:'blush'},
 {speaker:'JAY',text:'So. What do you say? ENHYPEN?',yn:'default',jay:'smile'},
 {speaker:'SOOBIN',text:'Or TXT? It is YOUR choice.',yn:'default'}

function showTownSquare(){
 center();
 const i=Math.max(0,Math.min(state.squareIndex||0,recruitmentLines.length));
 const selecting=i===recruitmentLines.length;
 const line=recruitmentLines[Math.min(i,recruitmentLines.length-1)];
 const scene=el('section','square-scene');
 const people=el('div','square-characters');
 const specs=[['soobin.png','SOOBIN',''],[ynImages[line.yn]||ynImages.default,'Y/N','square-yn'],[line.jay==='smile'?'jay-smile.png':'jay-default.png','JAY','']];
 specs.forEach(([src,name,cl])=>{
   const img=document.createElement('img');img.src=src;img.alt=name;
   img.className='square-person '+cl+(!selecting&&line.speaker!==name?' not-speaking':'');
   people.append(img);
 });
 const box=el('div','panel');
 box.append(el('div','speaker',selecting?'YOUR CHOICE':line.speaker));
 box.append(el('p','dialogue',selecting?'Which group should Y/N join?':line.text));
 if(!selecting)box.append(el('p','dialogue-progress',(i+1)+' / '+recruitmentLines.length));
 const actions=el('div','nav');
 if(selecting){
  [['Join TXT','TXT'],['Join ENHYPEN','ENHYPEN']].forEach(([label,g])=>actions.append(btn(label,()=>{state.group=g;state.introMissionDone=false;state.visited=[];go('arrival')},g==='TXT'?'secondary':'primary')));
 }else{
  actions.append(btn(i===recruitmentLines.length-1?'Choose a group >>':'Next >>',()=>{state.squareIndex=i+1;go('town-square')}));
 }
 box.append(actions);scene.append(people,box);
 add(el('div','square-place','DOWNTOWN / CENTRAL PLAZA'),scene);
}

const locations={home:{name:'Your mansion',symbol:'[ E ]',caption:'Your new home in Kpopville'},street:{name:'Town square',symbol:'[ ! ]',caption:'Everyone seems to be here'},cafe:{name:'Kpop café',symbol:'[ C ]',caption:'A café with questionable menu items'},neighbors:{name:'Other group’s house',symbol:'[ ? ]',caption:'The neighbors are suspiciously loud'}};
function locationOpen(key){state.visited=[...new Set([...state.visited,key])];state.current=key;go('location')}
function updateMission(){
 const tasks={
 title:['Start your adventure','Press Start game.'],
 intro:['Arrive in Kpopville','Watch the donation introduction.'],
 'town-square':['Choose your group','Listen to Soobin and Jay, then make your choice.'],
 choose:['Choose a group','Pick TXT or ENHYPEN.'],
 arrival:['Arrive in Kpopville','Click Explore Kpopville.'],
 map:['Explore Kpopville','Click Boyborhood or Girlborhood on the map.'],
 downtown:['Explore Downtown','Choose a location to visit.'],
 'downtown-place':['Explore Downtown','Return to Downtown when you are ready.'],
 neighborhood:['Visit a house','Blue houses are clickable. Gray houses are locked.'],
 house:['Look around the house','Go back to the neighborhood when you are done.'],
 'enhypen-dialogue':['Talk to Sunghoon','Finish your conversation.'],
 park:['Photocard Park','Explore the park. Events will appear here later.'],
 gym:['Visit the Gym','Ask Sunghoon about workouts or choose an exercise.'],
 salon:['Visit Wonyoung at the Salon','Talk to Wonyoung or choose a beauty treatment.'],
 'txt-dialogue':['Talk to Soobin','Finish your conversation.'],
 location:['Explore this location','Return to the map when ready.']
 };
 let [objective,hint]=tasks[state.scene]||tasks.title;
 if(state.group && !['title','intro','town-square','choose'].includes(state.scene)){
   if(state.introMissionDone){objective='MISSION COMPLETE!';hint='You spoke with '+(state.group==='TXT'?'Soobin':'Sunghoon')+'. Explore Kpopville!';}
   else {objective='Talk to '+(state.group==='TXT'?'Soobin':'Sunghoon');hint='Go to Boyborhood → '+state.group+' house and finish the conversation.';}
 }
 document.getElementById('missionText').textContent=objective;
 document.getElementById('missionHint').textContent=hint;
}
// Reserved for future plot events. A mission can set state.specialVisit to
// {place:'gym'|'salon'|'park',character:'Name',text:'...'}.
function showActivity(place){
 center();
 let title={park:'PHOTOCARD PARK',gym:'GYM',salon:'SALON'}[place];
 add(tag(title));
 let back=btn('← MAIN MAP',()=>go('map'),'neighborhood-back');add(back);
 let box=el('section','activity-scene');
 let art=el('div','activity-art');
 if(place==='gym'||place==='salon'){
   let bg=document.createElement('img');
   bg.src=place==='gym'?'gym-bg.png':'salon-bg.png';
   bg.alt=place==='gym'?'Your hand-drawn gym interior':'Your hand-drawn salon interior';
   bg.className='background-asset';
   art.append(bg);
 }
 if(place==='gym'){
   let sunghoon=document.createElement('img');sunghoon.src='hoon.png';sunghoon.alt='Sunghoon working at the front desk';sunghoon.className='desk-person';art.append(sunghoon,el('div','desk-sign','SUNGHOON / FRONT DESK'));
 }else{
   if(place==='salon'){
     let wonyoung=document.createElement('img');wonyoung.src='wonyoung-default.png';wonyoung.alt='Wonyoung working at the front desk';wonyoung.className='desk-person wonyoung-desk';art.append(wonyoung,el('div','desk-sign','WONYOUNG / FRONT DESK'));
   }else{
     let park=document.createElement('img');park.src='park-bg.png';park.alt='Park background';park.className='background-asset';art.append(park);
   }
 }
 let controls=el('div','activity-controls');
 let msg=el('p','activity-message',place==='gym'?'Sunghoon: Welcome to the gym.':place==='salon'?'Wonyoung: Welcome to the salon!':'The park is quiet today.');
 controls.append(msg);
 function activityButton(name,response){controls.append(btn(name,()=>{msg.textContent=response},'secondary'))}
 if(place==='gym'){
  activityButton('Talk to Sunghoon','Sunghoon: Want to work out, or are you just visiting?');
  activityButton('Treadmill','Y/N tries running on the treadmill.');
  activityButton('Lift weights','Y/N does a few reps.');
  activityButton('Stretch','Y/N does some stretches.');
 }else if(place==='salon'){
  activityButton('Talk to Wonyoung','Wonyoung: What are we doing today? Hair, nails, facial, or makeup?');
  activityButton('Hair','The stylist fixes Y/N’s hair.');
  activityButton('Nails','Y/N gets her nails done.');
  activityButton('Facial','Y/N gets a facial treatment.');
  activityButton('Makeup','Y/N tries a new makeup look.');
 }
 const mission=state.specialVisit;
 const active=mission&&mission.place===place;
 if(active){
   activityButton('Meet '+mission.character,mission.text||('You talk to '+mission.character+'.'));
 }else if(place!=='park'){
   let locked=btn('Special visitor (mission only)',()=>{msg.textContent='No special visitor mission is active right now.'},'secondary');controls.append(locked);
 }else if(state.parkEvent){
   activityButton('Join event',state.parkEvent);
 }
 box.append(art,controls);add(box);
}
function render(){screen.replaceChildren();updateMission();
if(state.scene==='title'){center();add(tag('A very unserious adventure'),el('h1','big','Welcome to Kpopville'),el('p','lead','A tiny click-to-explore story game. There are no downloads, no battles, and absolutely no reasonable adults.'));add(btn('Start game',()=>go('intro')));if(state.group)add(btn('Continue saved game',()=>go('map'),'secondary'));}
else if(state.scene==='intro'){center();add(tag('Prologue: The donation'),stage('MOM?!','YOUR FUTURE DONATION VIDEO GOES HERE'),panel('MOM','I donated you to Kpopville. The manager is waiting outside.',[['Continue to Town Square',()=>{state.squareIndex=0;go('town-square')}] ]));}
else if(state.scene==='choose'){state.scene='town-square';render();}
else if(state.scene==='town-square'){showTownSquare()}
else if(state.scene==='arrival'){center();add(tag('Chapter 1: A new address'),stage('KPOPVILLE','DRAW THE CITY HERE'),panel('NARRATOR',`After a very loud argument in Central Plaza, you chose ${state.group}. The group is ready to take you to their house.`,[['Explore Kpopville',()=>go('map')]]));}
else if(state.scene==='map'){
center();add(el('p','map-caption','CLICK A NEIGHBORHOOD TO ENTER IT'));
let m=el('div','worldmap');let img=document.createElement('img');img.src='kpopville-map.png';img.alt='Your hand-drawn Kpopville map';m.append(img);
[['girl','girls','Girlborhood'],['boy','boys','Boyborhood']].forEach(([cls,area,label])=>{let b=btn(label,()=>{state.area=area;go('neighborhood')},'hotspot '+cls);b.setAttribute('aria-label','Enter '+label);b.title='Enter '+label;m.append(b)});
let downtown=btn('Enter Downtown',()=>go('downtown'),'hotspot downtown');downtown.setAttribute('aria-label','Enter Downtown');downtown.title='Enter Downtown';m.append(downtown);
[['park','Park'],['gym','Gym'],['salon','Salon']].forEach(([id,label])=>{let b=btn('Enter '+label,()=>go(id),'hotspot '+id);b.setAttribute('aria-label','Enter '+label);b.title='Enter '+label;m.append(b)});
add(m);add(el('p','map-caption','CLICK DOWNTOWN, BOYBORHOOD, OR GIRLBORHOOD'));
}
else if(['park','gym','salon'].includes(state.scene)){showActivity(state.scene)}
else if(state.scene==='downtown'){
center();
const backToMain=btn('← MAIN MAP',()=>go('map'),'neighborhood-back');
backToMain.setAttribute('aria-label','Back to Kpopville main map');
add(backToMain);add(tag('Kpopville'),el('h1','big','DOWNTOWN'),el('p','lead','Click a place on your Downtown map.'));
let m=el('div','downtownmap');let img=document.createElement('img');img.src='downtown-map.png';img.alt='Your hand-drawn Downtown map';m.append(img);
[['dthospital','hospital','Hospital'],['dtstudio','studio','Dance / Singing Studio'],['dtplaza','plaza','Central Plaza'],['dtmall','mall','Mall'],['dtclub','club','Club'],['dtbakery','bakery','Bakery']].forEach(([cls,id,label])=>{
 let b=btn(label,()=>{state.downtownPlace=id;go('downtown-place')},'hotspot '+cls);
 b.setAttribute('aria-label','Enter '+label);
 b.title='Enter '+label;
 m.append(b);
});
add(m,el('p','map-caption','CLICK HOSPITAL, STUDIO, CENTRAL PLAZA, MALL, CLUB, OR BAKERY'));
}
else if(state.scene==='downtown-place'){
center();
const backToDowntown=btn('← DOWNTOWN',()=>go('downtown'),'neighborhood-back');
backToDowntown.setAttribute('aria-label','Back to Downtown map');
add(backToDowntown);
let name=downtownPlaces[state.downtownPlace]||'Downtown';
if(state.downtownPlace==='plaza'){
 add(tag('Downtown'),el('h1','big','CENTRAL PLAZA'),el('div','plaza-view'),panel('NARRATOR','You are back at Town Square. The fountain is still here.',[['Back to Downtown',()=>go('downtown')],['Kpopville map',()=>go('map'),'secondary']]));
}else{
 add(tag('Downtown'),el('h1','big',name),stage('[ '+name.toUpperCase()+' ]','YOUR '+name.toUpperCase()+' DRAWING GOES HERE'),panel('NARRATOR','You are at the '+name+'. This location is a placeholder until you add your art and story.',[['Back to Downtown',()=>go('downtown')],['Kpopville map',()=>go('map'),'secondary']]));
}
}
else if(state.scene==='neighborhood'){
center();
const girls=state.area==='girls';
const groups=girls
 ? [
   {name:'ILLIT',unlocked:false},
   {name:'LE SSERAFIM',unlocked:false},
   {name:'AESPA',unlocked:false},
   {name:'TWICE',unlocked:true},
   {name:'IVE',unlocked:true},
   {name:'BLACKPINK',unlocked:false},
   {name:'ITZY',unlocked:false},
   {name:'NMIXX',unlocked:false},
   {name:'NEWJEANS',unlocked:false},
   {name:'RED VELVET',unlocked:false},
   {name:'BABYMONSTER',unlocked:false},
   {name:'KATSEYE',unlocked:false}
 ]
 : [
   {name:'ENHYPEN',unlocked:true},
   {name:'TXT',unlocked:true},
   {name:'BTS',unlocked:false},
   {name:'STRAY KIDS',unlocked:false},
   {name:'SEVENTEEN',unlocked:false},
   {name:'ATEEZ',unlocked:false},
   {name:'NCT 127',unlocked:false},
   {name:'RIIZE',unlocked:false},
   {name:'TWS',unlocked:false},
   {name:'TREASURE',unlocked:false},
   {name:'BOYNEXTDOOR',unlocked:false},
   {name:'SHINee',unlocked:false}
 ];
const positions=[
 {left:2.5,top:1.5},{left:22.5,top:1.5},{left:42.5,top:1.5},{left:62.5,top:1.5},
 {left:6,top:32.5},{left:25,top:32.5},{left:54,top:32.5},{left:73,top:32.5},
 {left:6,top:67},{left:25,top:67},{left:54,top:67},{left:73,top:67}
];
add(el('h1','big',girls?'GIRLBORHOOD':'BOYBORHOOD'));
let map=el('div','hoodmap');
let img=document.createElement('img');img.src='neighborhood-bg.png';img.alt='Neighborhood background with roads';map.append(img);
groups.forEach((group,i)=>{
 const pos=positions[i];
 let b=document.createElement('button');
 b.className='hood-house'+(group.unlocked?'':' locked');
 b.style.left=pos.left+'%';
 b.style.top=pos.top+'%';
 b.title=group.unlocked?('Enter '+group.name):(group.name+' is locked');
 b.setAttribute('aria-label',b.title);
 if(!group.unlocked) b.disabled=true;
 const icon=document.createElement('img');
 icon.src=group.unlocked?'house-blue.png':'house-gray.png';
 icon.alt='';
 const label=el('span','house-label',group.name);
 b.append(icon,label);
 if(group.unlocked){
   b.onclick=()=>{state.house=group.name;if(group.name==='ENHYPEN'){state.dialogueIndex=0;go('enhypen-dialogue')}else if(group.name==='TXT'){state.house='TXT';go('house')}else{go('house')}};
 }
 map.append(b);
});
const backButton=btn('← MAIN MAP',()=>go('map'),'neighborhood-back');
backButton.setAttribute('aria-label','Back to Kpopville main map');
add(map,backButton);
}
else if(state.scene==='enhypen-dialogue'){showEnhypenDialogue()}
else if(state.scene==='txt-dialogue'){showTxtDialogue()}

else if(state.scene==='house'){
center();
if(state.house==='TXT'){
 add(tag('TXT HOUSE'),el('h1','big','TXT HOUSE'),imageStage('txt-house-outside.png','TXT house exterior'),panel('NARRATOR','You are outside the TXT house. Click below to go inside and talk to Soobin.',[['Go inside / Talk to Soobin',()=>{state.txtDialogueIndex=0;go('txt-dialogue')}],['Back to neighborhood',()=>go('neighborhood'),'secondary']]));
}else if(state.house==='ENHYPEN'){
 add(tag('ENHYPEN HOUSE'),el('h1','big','ENHYPEN HOUSE'),imageStage('enhypen-house-inside.png','ENHYPEN house interior'),panel('NARRATOR','You are inside the ENHYPEN house now. You can add more dialogue, room exploration, or another cutscene here later.',[['Back to neighborhood',()=>go('neighborhood')],['Main map',()=>go('map'),'secondary']]));
}else{
 add(tag('House'),stage('[ HOUSE ]','YOUR '+(state.house||'GROUP')+' HOUSE ART GOES HERE'),panel(state.house||'NARRATOR',`You're at the ${state.house||'group'} house. More story and dialogue will be added later.`,[['Back to neighborhood',()=>go('neighborhood')],['Main map',()=>go('map'),'secondary']]));
}
}
else if(state.scene==='location'){center();let key=state.current||'home',x=locations[key]||locations.home;add(tag(x.name),stage('???','YOUR DRAWING GOES HERE'));let line={home:`Welcome to the ${state.group} house! Your room is somewhere around here, probably.`,street:'The entire town is shaped like someone lost control of a K-pop-themed building simulator.',cafe:'BARISTA: Welcome! Our special today is an aggressively burnt pancake.',neighbors:`NEIGHBOR: Oh, you're staying with ${state.group}? Interesting. Very interesting.`}[key];add(panel(key==='cafe'?'BARISTA':key==='neighbors'?'NEIGHBOR':'NARRATOR',line,[['Back to map',()=>go('map')],['Talk again',()=>render(),'secondary']]));}
}
document.getElementById('reset').onclick=()=>{if(confirm('Restart the demo and erase your saved choice?')){localStorage.removeItem(KEY);state={scene:'title',group:null,visited:[]};render()}};render();
</script>
