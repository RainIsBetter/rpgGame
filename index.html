<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kpopville map test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:black;font-family:Arial,sans-serif}button{font:700 17px Arial;cursor:pointer;background:#d8d8d8;border:3px solid black;border-radius:0;padding:10px 18px;box-shadow:3px 3px 0 #888}button:hover{background:#b7d5ff}button:active{box-shadow:none;transform:translate(3px,3px)}.screen{display:none;min-height:100vh}.screen.active{display:block}#main{display:none;min-height:100vh;align-items:center;justify-content:center}#main.active{display:flex}.map{position:relative;width:min(100vw, calc(100vh * 2048 / 1423));aspect-ratio:2048 / 1423}.map img{display:block;width:100%;height:100%;object-fit:contain}.hotspot{position:absolute;background:transparent;border:3px dashed transparent;box-shadow:none;padding:0;transform:none}.hotspot:hover,.hotspot:focus-visible{background:rgba(255,255,255,.18);outline:none;border:3px dashed #222}.hotspot:active{transform:none}.hotspot span{position:absolute;left:-9999px}.girl{left:6%;top:22%;width:23%;height:45%;border-radius:45%}.boy{left:50%;top:7%;width:25%;height:35%;border-radius:42%}.map-help{position:fixed;bottom:10px;left:10px;background:#fff;border:2px solid #000;padding:6px;font-size:13px;z-index:2}.neighborhood{padding:15px 18px}.toolbar{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.toolbar h1{font:700 32px Arial;margin:5px 0}.submap{border:4px solid black;position:relative;width:min(1100px,calc(100vw - 36px));height:min(69vh,650px);min-height:390px;margin:18px auto 8px;background:#fff;overflow:hidden}.road{position:absolute;background:#b7b7b7;border:3px solid black}.road.h{left:0;right:0;top:45%;height:16%}.road.v{left:46%;top:0;bottom:0;width:12%}.plot{position:absolute;width:25%;height:28%;border:4px solid black;display:flex;align-items:center;justify-content:center;font:700 clamp(14px,2.3vw,27px) Arial;text-align:center;cursor:pointer;background:#d5e5ff;box-shadow:4px 5px 0 #777;padding:5px}.plot:hover{background:#a9c8ff}.plot.girls{background:#ececec}.plot.girls:hover{background:#c8ddff}.p1{left:9%;top:7%}.p2{right:9%;top:7%}.p3{left:9%;bottom:7%}.p4{right:9%;bottom:7%}.house-roof{position:absolute;top:-19px;left:8%;width:84%;height:18px;border:3px solid black;background:#eee;clip-path:polygon(50% 0,100% 100%,0 100%)}.note{font-size:14px;margin:4px auto;max-width:1100px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;padding:18px}.modal.active{display:flex}.dialog{background:white;border:4px solid black;box-shadow:7px 7px 0 #444;padding:25px;width:min(480px,100%)}.dialog h2{margin:0 0 10px}.dialog button{margin-top:12px}
@media(max-width:600px){.map-help{font-size:11px}.toolbar h1{font-size:25px}.plot{border-width:3px}.neighborhood{padding:10px}.submap{width:100%;margin-top:10px}}
</style>
</head>
<body>
<section id="main" class="screen active">
  <div class="map">
    <img src="kpopville-map.png" alt="Hand drawn Kpopville map">
    <button class="hotspot girl" aria-label="Go to Girlborhood" onclick="openArea('girls')"><span>Girlborhood</span></button>
    <button class="hotspot boy" aria-label="Go to Boyborhood" onclick="openArea('boys')"><span>Boyborhood</span></button>
  </div>
  <div class="map-help">Click Girlborhood or Boyborhood on the map</div>
</section>
<section id="neighborhood" class="screen neighborhood">
  <div class="toolbar"><button onclick="showMain()">&lt; BACK TO KPOPVILLE</button><h1 id="areaTitle">BOYBORHOOD</h1></div>
  <div class="submap">
    <div class="road h"></div><div class="road v"></div>
    <div class="plot p1" role="button" tabindex="0"><div class="house-roof"></div></div>
    <div class="plot p2" role="button" tabindex="0"><div class="house-roof"></div></div>
    <div class="plot p3" role="button" tabindex="0"><div class="house-roof"></div></div>
    <div class="plot p4" role="button" tabindex="0"><div class="house-roof"></div></div>
  </div>
  <p class="note">TEMPORARY MAP. Replace with your drawing later. Click a house to test a location.</p>
</section>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><div class="dialog"><h2 id="dialogTitle">House</h2><p>This house will have a scene later.</p><button onclick="closeDialog()">OK</button></div></div>
<script>
const areaNames={boys:['ENHYPEN','TXT','BTS','STRAY KIDS'],girls:['ILLIT','TWICE','LE SSERAFIM','AESPA']};
function openArea(area){document.getElementById('main').classList.remove('active');document.getElementById('neighborhood').classList.add('active');document.getElementById('areaTitle').textContent=area==='girls'?'GIRLBORHOOD':'BOYBORHOOD';document.querySelectorAll('.plot').forEach((el,i)=>{let name=areaNames[area][i];el.classList.toggle('girls',area==='girls');el.innerHTML='<div class="house-roof"></div>'+name;el.onclick=()=>openDialog(name);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDialog(name)}}});}
function showMain(){closeDialog();document.getElementById('neighborhood').classList.remove('active');document.getElementById('main').classList.add('active')}
function openDialog(name){document.getElementById('dialogTitle').textContent=name+' HOUSE';document.getElementById('modal').classList.add('active')}
function closeDialog(){document.getElementById('modal').classList.remove('active')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialog()});
</script>
</body>
</html>
